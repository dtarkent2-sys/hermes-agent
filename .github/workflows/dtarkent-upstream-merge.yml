name: dtarkent upstream merge

on:
  push:
    branches:
      - automated-upstream-merge-20260828

permissions:
  contents: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: automated-upstream-merge-20260828

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream and resolve known conflicts
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch upstream main
          git merge --no-ff --no-commit upstream/main || true
          python .github/scripts/resolve_dtarkent_upstream_merge.py
          git add -A
          if git diff --cached --check; then
            echo "staged merge passes diff check"
          fi
          python -m py_compile \
            agent/background_review.py \
            agent/codex_responses_adapter.py \
            agent/context_compressor.py \
            agent/conversation_compression.py \
            gateway/platforms/base.py
          git commit -m "Merge NousResearch/main into dtarkent fork"

      - name: Publish resolved branch
        run: |
          git push --force-with-lease origin HEAD:upstream-update-20260828
